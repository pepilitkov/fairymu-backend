openapi: 3.0.3
info:
  title: FairyMU API
  version: 2.0.0
servers:
  - url: https://api.example.com
paths:
  /api/status:
    get:
      summary: Public API and server status
      responses:
        '200': { description: OK }
  /api/online:
    get:
      summary: Public online player count
      responses:
        '200': { description: OK }
  /api/rankings:
    get:
      summary: Public rankings
      responses:
        '200': { description: OK }
  /api/guilds:
    get:
      summary: Public guilds
      responses:
        '200': { description: OK }
  /api/events:
    get:
      summary: Public event schedule
      responses:
        '200': { description: OK }
  /api/register:
    post:
      summary: Register a FairyMU account
      responses:
        '201': { description: Created }
        '409': { description: Username or email already exists }
        '429': { description: Too many requests }
  /api/login:
    post:
      summary: Authenticate
      responses:
        '200': { description: Authenticated }
        '401': { description: Invalid credentials }
        '429': { description: Too many requests }
  /api/logout:
    post:
      summary: Revoke current in-memory session
      responses:
        '204': { description: Logged out }
  /api/account:
    get:
      summary: Current account
      security:
        - bearerAuth: []
      responses:
        '200': { description: Account }
        '401': { description: Unauthorized }
  /api/characters:
    get:
      summary: Characters for current account
      security:
        - bearerAuth: []
      responses:
        '200': { description: Character list }
        '401': { description: Unauthorized }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
