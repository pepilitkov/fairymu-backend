name: FairyMU Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fairymu-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    name: Build, memory tests, PostgreSQL tests and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fairymu_ci
          POSTGRES_USER: fairymu
          POSTGRES_PASSWORD: fairymu_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fairymu -d fairymu_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Show .NET version
        run: dotnet --version

      - name: Restore
        run: dotnet restore FairyMU.Api.csproj

      - name: Build Release
        run: dotnet build FairyMU.Api.csproj --configuration Release --no-restore

      - name: Run in-memory API smoke tests
        shell: bash
        run: bash scripts/smoke-test.sh

      - name: Run PostgreSQL API smoke tests
        shell: bash
        run: bash scripts/postgres-smoke-test.sh

      - name: Publish backend
        run: dotnet publish FairyMU.Api.csproj --configuration Release --no-build --output ./publish

      - name: Upload published backend
        uses: actions/upload-artifact@v7
        with:
          name: fairymu-backend-v2-${{ github.sha }}
          path: ./publish
          if-no-files-found: error
          retention-days: 14
